[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-memory"
version = "0.1.0"
description = "Local-first project memory for human maintainers and AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
agent-project-memory = "agent_project_memory.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_project_memory = ["schema.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
